# Style rules for NotiWindow. The package itself takes no dependency on SwiftLint —
# see scripts/lint.sh for how this config is run.

included:
  - Sources
  - Tests
  - Example

excluded:
  - .build
  - .swiftpm
  - .worktrees
  - .claude/worktrees
  - DerivedData
  - "**/DerivedData"
  - "**/.build"

analyzer_rules:
  - unused_import

opt_in_rules:
  - sorted_imports
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition
  - orphaned_doc_comment

disabled_rules:
  - trailing_comma
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, x, y, z, to]

type_name:
  min_length: 3
  max_length: 50

nesting:
  type_level: 2

function_body_length:
  warning: 80
  error: 150

# No custom rule bans non-adaptive color literals (`Color.red` and friends).
# NotiWindow ships no palette of its own: `NotiToast` renders whatever `Color` the
# caller hands it, and everything else is `.primary` or a material. The only literal
# colors in the repo are in `#Preview` blocks and the Example demo app, where naming
# a vivid color is the point.
